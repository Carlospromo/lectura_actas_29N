<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actas 29N · entorno sintético</title><style>
body{font:16px system-ui,sans-serif;margin:0;background:#f4f6f7;color:#17212b}main{max-width:760px;margin:auto;padding:16px}header{background:#132d47;color:white;padding:18px}h1{font-size:1.4rem;margin:0}section{background:white;padding:18px;margin:16px 0;border-radius:10px;box-shadow:0 1px 4px #ccd}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:10px;max-width:100%;box-sizing:border-box}input,select{width:100%}button{background:#135888;color:white;border:0;border-radius:6px;cursor:pointer;margin:6px 4px 6px 0}.danger{background:#9a3333}.notice{background:#ffecaa;padding:10px;border-radius:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere}img{max-width:100%}
</style></head><body><header><h1>Actas 29N · desarrollo local</h1></header><main><p class="notice">DATOS SINTÉTICOS. No son resultados electorales reales. OCR simulado: introduce las cifras manualmente.</p>
<section id="login"><h2>Acceso de prueba</h2><label>Usuario<select id="uid"><option value="1">Apoderado A (mesa A)</option><option value="2">Apoderado B (mesa B)</option><option value="3">Organización (dashboard)</option><option value="4">Supervisor (ambas mesas y dashboard)</option></select></label><label>Código de desarrollo<input id="code" value="TEST-ONLY-2026"></label><button onclick="login()">Entrar</button></section>
<section id="work" hidden><p id="who"></p><button onclick="logout()">Cerrar sesión</button><h2>Nueva acta</h2><label>Mesa autorizada<select id="table"></select></label><label>Fotografía JPEG o PNG<input id="file" type="file" accept="image/jpeg,image/png" capture="environment"></label><button onclick="upload()">Subir fotografía</button><p id="uploadstate"></p><h2>Mis envíos</h2><button onclick="refresh()">Actualizar</button><div id="docs"></div></section>
<section id="review" hidden><h2>Revisión manual</h2><p id="reviewtitle"></p><p id="proposal"></p><img id="photo" alt="Imagen del acta"><div id="reviewform"><label><input id="mesa-confirmed" type="checkbox" style="width:auto"> Confirmo que la fotografía muestra un acta de escrutinio de <strong>mesa</strong> para Congreso. Las actas CERA de Junta Provincial no se validan aquí.</label><div id="votes"></div><label>Blancos<input id="blank" type="number" min="0" step="1" value="0"></label><label>Nulos<input id="null" type="number" min="0" step="1" value="0"></label><label>Total<input id="total" type="number" min="0" step="1" value="0"></label><button onclick="review('validated')">Validar cifras revisadas</button><button class="danger" onclick="review('rejected')">Rechazar envío</button></div></section>
<section id="conflicts" hidden><h2>Discrepancias pendientes de organización</h2><button onclick="loadConflicts()">Actualizar discrepancias</button><div id="conflictlist"></div></section>
<section id="dashboard" hidden><h2>Dashboard privado</h2><button onclick="loadDashboard()">Actualizar</button><pre id="metrics"></pre></section><pre id="message"></pre></main><script>
let current=null,currentCandidacies=[];const $=id=>document.getElementById(id);async function api(url,options={}){let r=await fetch(url,{credentials:'same-origin',...options});let d=await r.json();if(!r.ok)throw Error(d.detail||JSON.stringify(d));return d}function msg(s){$('message').textContent=s}
async function login(){try{let d=await api('/api/dev/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:+$('uid').value,code:$('code').value})});await init()}catch(e){msg(e.message)}}
async function init(){try{let me=await api('/api/me');$('login').hidden=true;$('work').hidden=me.role==='organizacion';$('dashboard').hidden=!me.can_view_results;$('conflicts').hidden=!(me.can_view_results&&['organizacion','administrador'].includes(me.role));$('reviewform').hidden=me.role==='organizacion';$('who').textContent=me.name+' · '+me.role;let ts=await api('/api/tables');$('table').innerHTML=ts.map(t=>`<option value="${t.id}">Mesa ${t.label} · sección ${t.section}</option>`).join('');await refresh();if(me.can_view_results)await loadDashboard();if(!$('conflicts').hidden)await loadConflicts()}catch(e){$('login').hidden=false;msg(e.message)}}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
async function upload(){try{let f=$('file').files[0];if(!f)throw Error('Selecciona una fotografía');let d=await api('/api/documents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table_id:+$('table').value,mime_type:f.type,idempotency_key:crypto.randomUUID()})});let put=await fetch(d.upload_url,{method:'PUT',headers:{'Content-Type':f.type},body:f});if(!put.ok)throw Error('Error de subida '+put.status);let done=await api('/api/documents/'+d.id+'/complete',{method:'POST'});$('uploadstate').textContent='Recibido. Procesamiento en cola. '+d.id;await refresh()}catch(e){msg(e.message)}}
async function refresh(){try{let ds=await api('/api/documents');$('docs').replaceChildren();for(let d of ds){let p=document.createElement('p'),b=document.createElement('button');p.textContent=`Mesa ${d.table_id} · versión ${d.version} · ${d.status}${d.conflict?' · DISCREPANCIA':''} `;b.textContent='Abrir';b.onclick=()=>openDoc(d.id);p.appendChild(b);$('docs').appendChild(p)}}catch(e){msg(e.message)}}
async function openDoc(id){try{let d=await api('/api/documents/'+id);current=id;$('mesa-confirmed').checked=false;$('review').hidden=false;$('reviewtitle').textContent=`Mesa ${d.table_id} · versión ${d.version} · ${d.status}${d.current_validated?' · vigente':''}`;$('proposal').textContent=(d.extraction?JSON.parse(d.extraction.raw_json).note:'Extracción pendiente')+(d.review?'\nRevisión de '+d.review.reviewer+': '+JSON.stringify(d.review.values):'');if(!$('reviewform').hidden){currentCandidacies=await api(`/api/candidacies?table_id=${d.table_id}&election_id=${d.election_id}`);$('votes').replaceChildren();for(let c of currentCandidacies){let label=document.createElement('label'),input=document.createElement('input');label.textContent=c.name;input.type='number';input.min='0';input.step='1';input.value='0';input.dataset.candidacyId=c.id;label.appendChild(input);$('votes').appendChild(label)}}let image=await api('/api/documents/'+id+'/image');$('photo').src=image.url;window.scrollTo(0,$('review').offsetTop)}catch(e){msg(e.message)}}
async function review(decision){try{let v=input=>{let s=input.value;if(!/^\d+$/.test(s))throw Error('Sólo enteros no negativos');return Number(s)};let votes={};for(let input of $('votes').querySelectorAll('input'))votes[input.dataset.candidacyId]=v(input);let d=await api('/api/documents/'+current+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,mesa_congreso_confirmed:$('mesa-confirmed').checked,votes,blank:v($('blank')),null:v($('null')),total:v($('total'))})});msg(JSON.stringify(d));await refresh();if(!$('dashboard').hidden)await loadDashboard()}catch(e){msg(e.message)}}
async function loadConflicts(){try{let rows=await api('/api/conflicts');$('conflictlist').replaceChildren();for(let r of rows){let p=document.createElement('p');p.textContent=`Mesa ${r.table_id} · nueva ${r.document_id} · vigente ${r.incumbent_id} `;for(let [label,fn] of [['Ver nueva',()=>openDoc(r.document_id)],['Ver vigente',()=>openDoc(r.incumbent_id)],['Aceptar nueva',()=>resolve(r.document_id,'accept_new')],['Mantener vigente',()=>resolve(r.document_id,'keep_incumbent')]]){let b=document.createElement('button');b.textContent=label;b.onclick=fn;p.appendChild(b)}$('conflictlist').appendChild(p)}}catch(e){msg(e.message)}}
async function resolve(id,decision){let reason=prompt('Motivo de la decisión (queda auditado)');if(!reason)return;try{msg(JSON.stringify(await api('/api/conflicts/'+id+'/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,reason})})));await loadConflicts();await loadDashboard()}catch(e){msg(e.message)}}
async function loadDashboard(){try{$('metrics').textContent=JSON.stringify(await api('/api/dashboard'),null,2)}catch(e){msg(e.message)}}init();
</script></body></html>
