services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: actas
      POSTGRES_USER: actas
      POSTGRES_PASSWORD: actas_local
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actas"]
      interval: 2s
      retries: 30
  storage:
    build: .
    env_file: .env
    command: uvicorn app.storage_service:app --host 0.0.0.0 --port 9000
    ports: ["9000:9000"]
    volumes: [objects:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 2s
      retries: 30
  api:
    build: .
    env_file: .env
    ports: ["8001:8000"]
    depends_on:
      db: {condition: service_healthy}
      storage: {condition: service_healthy}
    command: sh -c "python -m app.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker:
    build: .
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      storage: {condition: service_healthy}
    command: python -m app.worker
volumes:
  pgdata:
  objects:
