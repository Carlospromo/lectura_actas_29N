services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: actas
      POSTGRES_USER: actas
      POSTGRES_PASSWORD: actas_local
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actas"]
      interval: 2s
      retries: 30
  storage:
    image: localstack/localstack:4.9.2
    environment:
      SERVICES: s3
      PERSISTENCE: "1"
      SNAPSHOT_SAVE_STRATEGY: ON_REQUEST
    ports: ["4566:4566"]
    volumes: [objects:/var/lib/localstack]
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      storage: {condition: service_started}
    command: sh -c "python -m app.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker:
    build: .
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      storage: {condition: service_started}
    command: python -m app.worker
volumes:
  pgdata:
  objects:
